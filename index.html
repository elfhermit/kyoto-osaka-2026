    function wmoToEmoji(code) {
      if (code === 0)  return { icon: "☀️", zh: "晴天" };
      if (code <= 3)   return { icon: "⛅", zh: "多雲" };
      if (code <= 49)  return { icon: "🌫️", zh: "霧/薄霧" };
      if (code <= 67)  return { icon: "🌧️", zh: "降雨" };
      if (code <= 77)  return { icon: "❄️", zh: "降雪" };
      if (code <= 82)  return { icon: "🌦️", zh: "陣雨" };
      if (code <= 99)  return { icon: "⛈️", zh: "雷陣雨" };
      return { icon: "🌡️", zh: "未知" };
    }

    function getClothingTip(maxC, minC, precipMm) {
      const diff = maxC - minC;
      let base = maxC >= 28 ? "輕薄短袖＋防曬"
               : maxC >= 22 ? "短袖＋薄外套"
               : maxC >= 16 ? "長袖＋薄外套"
               : "毛衣＋厚外套";
      const tips = [base];
      if (diff >= 10) tips.push("日夜溫差大，建議洋蔥穿搭");
      if (precipMm >= 1) tips.push(`預計降雨 ${precipMm.toFixed(1)}mm，帶摺疊傘`);
      return tips.join("，");

    // --- 主程式 ---
    function App() {
      const [currentDay, setCurrentDay] = useState(1);
      const [activeTab, setActiveTab] = useState("overview"); // overview | itinerary | transport | shopping | checklist | budget | more
      const [countdownMain, setCountdownMain] = useState({ label: "✨ 距離夢幻冒險出發倒數 (7/20 09:00)", text: "" });
      const [countdownHanabi, setCountdownHanabi] = useState("");
      const [quote, setQuote] = useState(KOUPEN_QUOTES[0]);
      const [toast, setToast] = useState(null);
      const [showBubble, setShowBubble] = useState(true);
      const [weather, setWeather] = useState({}); // key: "city|YYYY-MM-DD"

      // 訂位代號與訂房代號：僅存在使用者裝置的 localStorage（不進 Git、不上傳）
      const [pnr, setPnr] = useState(() => localStorage.getItem("travel_pnr_v1") || "");
      const [hotel1, setHotel1] = useState(() => localStorage.getItem("travel_hotel1") || "");
      const [hotel2, setHotel2] = useState(() => localStorage.getItem("travel_hotel2") || "");
      const [hotel3, setHotel3] = useState(() => localStorage.getItem("travel_hotel3") || "");

      // 預算狀態
      const [exchangeRate, setExchangeRate] = useState(0.20); // JPY ➔ TWD（2026/7 參考）
      const [dailyExpenses, setDailyExpenses] = useState(() => {
        try {
          const saved = localStorage.getItem("travel_expenses_v1");
          return saved ? JSON.parse(saved) : Array(9).fill(0);
        } catch {
          return Array(9).fill(0);
        }
      });

      // Checklist 狀態（v2：預設值與既有勾選合併）
      const [checkedItems, setCheckedItems] = useState(() => {
        const initial = {};
        CHECKLIST_SECTIONS.forEach(sec => {
          sec.items.forEach(item => {
            initial[item.id] = item.defaultDone;
          });
        });
        try {
          const saved = localStorage.getItem("travel_checked_items_v2");
          if (saved) Object.assign(initial, JSON.parse(saved));
        } catch {}
        return initial;
      });

      // 自動儲存至 LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem("travel_pnr_v1", pnr);
          localStorage.setItem("travel_hotel1", hotel1);
          localStorage.setItem("travel_hotel2", hotel2);
          localStorage.setItem("travel_hotel3", hotel3);
        } catch {}
      }, [pnr, hotel1, hotel2, hotel3]);

      useEffect(() => {
        try {
          localStorage.setItem("travel_expenses_v1", JSON.stringify(dailyExpenses));
        } catch {}
      }, [dailyExpenses]);

      useEffect(() => {
        try {
          localStorage.setItem("travel_checked_items_v2", JSON.stringify(checkedItems));
        } catch {}
      }, [checkedItems]);

      // 倒數計時（出發 ➔ 出發後自動切換為回程；花火倒數）
      useEffect(() => {
        const departTs = new Date("2026-07-20T09:00:00+08:00").getTime();
        const returnTs = new Date("2026-07-28T19:50:00+09:00").getTime();
        const hanabiTs = new Date("2026-07-25T19:30:00+09:00").getTime();

        const calcCountdown = (target, doneMsg) => {
          const diff = target - new Date().getTime();
          if (diff <= 0) return doneMsg;
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          return `${days}天 ${hours}時 ${minutes}分 ${seconds}秒`;
        };

        const tick = () => {
          const now = new Date().getTime();
          if (now < departTs) {
            setCountdownMain({ label: "✨ 距離夢幻冒險出發倒數 (7/20 09:00)", text: calcCountdown(departTs, "出發囉！✈️") });
          } else if (now < returnTs) {
            setCountdownMain({ label: "🛬 旅程進行中！距離回程班機 (7/28 19:50 JST)", text: calcCountdown(returnTs, "準備登機！") });
          } else {
            setCountdownMain({ label: "🌸 旅程已圓滿結束", text: "滿載企鵝與回憶，辛苦了！" });
          }
          setCountdownHanabi(calcCountdown(hanabiTs, "已綻放完畢，超美的吧！🎆"));
        };

        tick();
        const interval = setInterval(tick, 1000);
        return () => clearInterval(interval);
      }, []);

      // 天氣抓取（Open-Meteo，多城市分段）
      useEffect(() => {
        async function fetchWeather() {
          const map = {};
          await Promise.all(WEATHER_SOURCES.map(async (src) => {
            try {
              const url = "https://api.open-meteo.com/v1/forecast" +
                `?latitude=${src.lat}&longitude=${src.lon}` +
                "&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode" +
                "&timezone=Asia%2FTokyo" +
                `&start_date=${src.start}&end_date=${src.end}`;
              const res = await fetch(url);
              const d = await res.json();
              if (!d.daily || !d.daily.time) return;
              d.daily.time.forEach((date, i) => {
                const wmo = wmoToEmoji(d.daily.weathercode[i]);
                const maxC = Math.round(d.daily.temperature_2m_max[i]);
                const minC = Math.round(d.daily.temperature_2m_min[i]);
                const precip = +((d.daily.precipitation_sum[i] || 0).toFixed(1));
                map[`${src.key}|${date}`] = {
                  icon: wmo.icon, zh: wmo.zh,
                  max: maxC, min: minC, precip,
                  clothing: getClothingTip(maxC, minC, precip)
                };
              });
            } catch (e) {
              console.warn("Weather fetch failed:", src.key, e);
            }
          }));
          setWeather(map);
        }
        fetchWeather();
      }, []);

      // 旅程期間自動跳到「今天」的行程（行動裝置查詢神器）
      useEffect(() => {
        const t = new Date();
        const iso = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
        const todayData = DAYS_DATA.find(d => d.iso === iso);
        if (todayData) {
          setCurrentDay(todayData.day);
          setActiveTab("itinerary");
