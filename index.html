      const [dailyExpenses, setDailyExpenses] = useState(() => {
        try {

        } catch {
          return Array(9).fill(0);
        }
      });

      // Checklist 狀態
      const [checkedItems, setCheckedItems] = useState(() => {
        try {
          const saved = localStorage.getItem("travel_checked_items_v1");
          if (saved) return JSON.parse(saved);
        } catch {}
        const initial = {};
        CHECKLIST_SECTIONS.forEach(sec => {
          sec.items.forEach(item => {
            initial[item.id] = item.defaultDone;
          });
        });
        return initial;
      });

      // 自動儲存至 LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem("travel_hotel1", hotel1);
          localStorage.setItem("travel_hotel2", hotel2);
          localStorage.setItem("travel_hotel3", hotel3);
        } catch {}
      }, [hotel1, hotel2, hotel3]);

      useEffect(() => {
        try {
          localStorage.setItem("travel_expenses_v1", JSON.stringify(dailyExpenses));
        } catch {}
      }, [dailyExpenses]);

        try {
          localStorage.setItem("travel_checked_items_v1", JSON.stringify(checkedItems));
        } catch {}
      }, [checkedItems]);

      // 倒數計時計時器
      useEffect(() => {
        const interval = setInterval(() => {
          const targetAoniyoshi = new Date("2026-06-24T09:30:00+08:00").getTime();
          const targetDepart = new Date("2026-07-20T09:00:00+08:00").getTime();
          const now = new Date().getTime();

          const calcCountdown = (target) => {
            const diff = target - now;
            if (diff <= 0) return "已截止 / 已抵達！✨";
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return `${days}天 ${hours}時 ${minutes}分 ${seconds}秒`;
          };

          setCountdownAoniyoshi(calcCountdown(targetAoniyoshi));
          setCountdownDepart(calcCountdown(targetDepart));
        }, 1000);

        return () => clearInterval(interval);
      }, []);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);

        let nextQuote = quote;

                    <div>
                      <h4 class="text-xs font-black text-amber-700">可調式換算匯率</h4>
                      <p class="text-[9px] text-slate-400">當前設定：1 日圓 = {exchangeRate} 新台幣</p>
                    </div>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-[10px] font-bold text-slate-500">自訂匯率：</span>
                    <input 
                      type="number" 
                      step="0.001"
                      value={exchangeRate}
                      onChange={(e) => setExchangeRate(parseFloat(e.target.value) || 0.215)}
                      class="w-20 bg-white border border-amber-200 rounded-xl px-2 py-1 text-xs font-bold text-slate-600 focus:outline-none focus:border-amber-400"
                    />
                  </div>
                </div>

                {/* Input Grid */}
                <div class="flex flex-col gap-3">
                  {DAYS_DATA.map((d, idx) => (
                    <div key={d.day} class="bg-slate-50/50 border border-slate-100 rounded-2xl p-3.5 flex flex-col gap-2">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-black text-slate-500">Day {d.day} 行程</span>
                        <span class="text-[9px] text-slate-400 font-bold bg-white px-2 py-0.5 rounded-full border border-slate-100">{d.city}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <input 
                          type="number" 
                          value={dailyExpenses[idx] === 0 ? "" : dailyExpenses[idx]} 
                          onChange={(e) => handleExpenseChange(idx, e.target.value)}
                          placeholder="請輸入日圓開銷 JPY"
                          class="flex-1 bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 focus:outline-none focus:border-rose-400 shadow-inner"
                        />
                        <span class="text-xs font-bold text-slate-400">円</span>
                      </div>
                      <div class="flex justify-between text-[10px] font-bold text-slate-400 border-t border-slate-100/30 pt-2">
                        <span>換算新台幣：</span>
                        <span class="text-rose-500">
                          NT$ {Math.round(dailyExpenses[idx] * exchangeRate).toLocaleString()} 元
                        </span>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Totals Summary */}
                <div class="mt-6 pt-5 border-t border-pink-50 flex flex-col items-center gap-3">
                  <div class="text-center">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-wider">合計本次行程預算開支</h3>
                    <p class="text-[9px] text-slate-400 mt-0.5">（不含機票、環球影城門票等已付大筆款項）</p>
                  </div>
                  
                  <div class="w-full grid grid-cols-2 gap-3.5 mt-2">
                    <div class="bg-brand-cream border border-pink-50 rounded-2xl p-3 text-center">
                      <div class="text-[9px] font-bold text-slate-400">總日圓花費</div>
                      <div class="text-sm font-black text-slate-700 mt-1">
                        {dailyExpenses.reduce((a, b) => a + b, 0).toLocaleString()} 円
                      </div>
                    </div>
                    <div class="bg-brand-pink border border-brand-pinkDark/10 rounded-2xl p-3 text-center">
                      <div class="text-[9px] font-bold text-brand-pinkDark">換算新台幣</div>
                      <div class="text-sm font-black text-rose-500 mt-1">
                        NT$ {Math.round(dailyExpenses.reduce((a, b) => a + b, 0) * exchangeRate).toLocaleString()} 元
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </main>
          )}

          {/* Footer Text */}
          <footer class="mt-12 text-center text-slate-400 text-[10px] px-6">
            <p class="font-extrabold flex items-center justify-center gap-1 text-slate-500">
              🌸 祝旅途愉快！滿載御朱印、限定企鵝、滿滿正能量平安返台 🐧⛩️🎆
            </p>
            <p class="text-[9px] opacity-80 mt-1">專屬 30 代慢活、週年紀念、精準掃貨版指南</p>
          </footer>

          {/* Floating Koupen-chan widget (Bottom Right) */}
          <div class="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-2">
            {showBubble && (
              <div class="bg-white border-2 border-brand-pinkDark/30 text-slate-700 rounded-2xl p-3 shadow-xl max-w-[170px] relative animate-pop-bubble select-none">
                {/* Close bubble */}
                <button 
                  onClick={() => setShowBubble(false)}
                  class="absolute -top-2 -right-2 bg-slate-100 hover:bg-slate-200 text-slate-500 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black border border-slate-200"
                >
                  ✕
                </button>
                <p class="text-[10px] font-bold leading-relaxed">{quote}</p>
                {/* Little speech bubble tail */}
                <div class="absolute right-6 -bottom-1.5 w-3 h-3 bg-white border-r-2 border-b-2 border-brand-pinkDark/30 rotate-45"></div>
              </div>
            )}
            
            <button 
              onClick={rollQuote}
              class="w-14 h-14 bg-white hover:bg-brand-pink rounded-full shadow-2xl flex items-center justify-center border-2 border-brand-pinkDark/30 active:scale-95 transition-all animate-cute-float"
            >
              <KoupenIllust size="w-11 h-11" withClover={false} />
            </button>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
